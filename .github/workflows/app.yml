name: App

on:
  pull_request:
    paths:
      - app/**
      - .github/workflows/app.yml

permissions:
  contents: read

jobs:
  flutter:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The SDK FrockBot's client requires (app/pubspec.yaml).
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Resolve pinned packages
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        # The client names no deployment of its own, so the suite passes an
        # origin that reaches nothing, as FrockBot's does.
        run: flutter test --no-pub --dart-define=FROCKBOT_ORIGIN=https://tests.invalid
