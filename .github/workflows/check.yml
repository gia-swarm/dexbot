name: Check

# What a pull request owes before it may merge: the fast tier. `Check` is the
# Bun workspace — typecheck, the unit tests (the Packages' and `scripts/`'s),
# and the deploy dry run, which builds the Worker and the application artifact
# from the published @frockbot/* packages without reaching Cloudflare.
# `Flutter` is the client's analysis and tests. Both run on every pull request,
# with no path filter, so the babysitter can wait on both by name without
# guessing whether one was meant to run. There is no format step because
# DexBot has no formatter configured.
#
# It runs against the pull request's own head, not a rebase onto current
# `main`. What the merge actually produced is checked by `main.yml`, which
# calls this workflow again on the merge commit.
#
# GitHub's free plan has no rulesets, so nothing requires these checks: the
# babysitter waits on them by the job names below (`REQUIRED_CHECKS` in
# `scripts/babysit.ts`, which a test reads back from this file).

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A pull request's newer push cancels its older run. Called from `main.yml`
# there is no pull request, and the run id keeps each `main` run its own group,
# so nothing on `main` is ever cancelled from here.
concurrency:
  group: check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Seconds, and it is what catches a bump of the @frockbot/* pins that
      # no longer bundles with DexBot's profile, brand and auth Package.
      - name: Deploy dry run
        run: bun run deploy:dry-run

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The SDK FrockBot's client requires (app/pubspec.yaml).
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Resolve pinned packages
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        # The client names no deployment of its own, so the suite passes an
        # origin that reaches nothing, as FrockBot's does.
        run: flutter test --no-pub --dart-define=FROCKBOT_ORIGIN=https://tests.invalid
