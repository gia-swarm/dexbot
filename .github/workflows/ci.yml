name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # Builds the Worker and the application artifact from the published
      # @frockbot/* packages with DexBot's profile, brand and auth Package,
      # and checks the bundle, without reaching Cloudflare.
      - run: bun run deploy:dry-run
